<!DOCTYPE html>
<html>

<head>

    <title>SlayCart Admin</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body>

<div class="form-container">

<h1>Add Product</h1>

<form method="POST">

<input type="text"
       name="name"
       placeholder="Product Name">

<input type="text"
       name="price"
       placeholder="Price">

<input type="text"
       name="image"
       placeholder="Image URL">

<button type="submit">
    Add Product
</button>

</form>

</div>

<h1 style="text-align:center;">
    Existing Products
</h1>

<div class="products">

{% for product in products %}

<div class="card">

<img src="{{ product.image }}">

<div class="card-content">

<h2>{{ product.name }}</h2>

<p class="price">
₹{{ product.price }}
</p>

<a href="/delete-product/{{ product.id }}">

<button>
Delete Product
</button>

</a>

</div>

</div>

{% endfor %}

</div>

</body>
</html>
